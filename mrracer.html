    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            color: #0277bd;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;

            justify-content: center;

        h1 {

            margin: 0;
        }
        .game-container {
            text-align: center;
            width: 80%;
            max-width: 1000px;
        }
        .game-container iframe {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 10px;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .controls button {
            padding: 10px;
            background-color: #0288d1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .controls button:hover {

        }
        .back-link {
            margin-top: 20px;
            padding: 10px;
            background-color: #ffeb3b;
            color: white;

            border-radius: 5px;
        }

<body>
    <h1>GamingHub</h1>
    <div class="game-container">

        <iframe src="https://html5.gamemonetize.co/y34098moqvr8ueuddbb4vnwxmtorlq4i/" title="Mr Racer Game"></iframe>
        <div class="controls">
            <button onclick="toggleFullscreen()">Go Full Screen</button>
            <a href="index.html" class="back-link">Back to Game Hub</a>
        </div>
    </div>

    <script>
function toggleFullscreen() {
    const iframe = document.querySelector('iframe'); // Get the iframe element
    if (document.fullscreenElement) {
        document.exitFullscreen();
    } else {
        iframe.requestFullscreen(); // Make the iframe go fullscreen
    }
}
    </script>

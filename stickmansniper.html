<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GamingHubPlay - Your ultimate gaming destination!">
  <meta name="keywords" content="games, gaming, game hub">
  <title>GamingHub - Stickman Sniper</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      background-color: #0288d1;
      color: white;
      padding: 20px;
      width: 100%;
      text-align: center;
    }
    .game-container {
      text-align: center;
      width: 80%;
      max-width: 1000px;
    }
    .game-container iframe {
      width: 100%;
      height: 80vh;
      border: none;
      border-radius: 10px;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .controls button {
      padding: 10px;
      background-color: #0288d1;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .controls button:hover {
      background-color: #0277bd;
    }
    .back-link {
      margin-top: 20px;
      padding: 10px;
      background-color: #ffeb3b;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .back-link:hover {
      background-color: #fbc02d;
    }
  </style>
</head>
<body>
  <h1>GamingHub</h1>
  <div class="game-container">
    <h2>Stickman Sniper</h2>
    <iframe src="https://html5.gamemonetize.co/58o5c66cu7kdk0y2pap14twa0dx24btb/" title="Stickman Sniper Game"></iframe>
    <div class="controls">
      <button onclick="toggleFullscreen()">Go Full Screen</button>
      <a href="index.html" class="back-link">Back to Game Hub</a>
    </div>
  </div>

  <script>
function toggleFullscreen() {
    const iframe = document.querySelector('iframe');
    if (document.fullscreenElement) {
        document.exitFullscreen();
    } else {
        iframe.requestFullscreen();
    }
}
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1720344232804931"
     crossorigin="anonymous"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, minimal-ui">
  <meta name="theme-color" content="#007bff">
  <meta name="description" content="GamingHubPlay is your one-stop hub for gaming news, reviews, and community discussions.">
<meta name="keywords" content="gaming, news, reviews, community, games">
  <title>Search Results</title>
  <style>
 body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #007bff;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 1rem;
    }

    .search {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .search input {
      padding: 0.5rem;
      width: 80%;
      max-width: 400px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .search button {
      padding: 0.5rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .search button:hover {
      background-color: #0056b3;
    }

    .games-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0; /* No space between games */
      padding: 0;
      justify-content: flex-start; /* Align to the left */
    }

    .game {
      display: block;
      width: 200px; /* Fixed width for each image block */
      height: 150px; /* Adjusted height to fit the image and text */
      text-align: center; /* Center the text below the image */
    }

    .game img {
      width: 100px;  /* Fixed width of the image */
      height: 75px;  /* Fixed height of the image */
      cursor: pointer;
      object-fit: cover; /* Ensures the image covers the area properly */
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .game img:hover {
      filter: brightness(0.8) blur(2px); /* Apply blur and brightness on hover */
      box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8); /* White aura effect */
    }

    .game h3 {
      margin-top: 0.5rem; /* Space between image and text */
      font-size: 1rem;    /* Adjust text size */
      color: #333;
      cursor: pointer;
    }
  </style>
</head>
<header>
  <h1><a href="https://gaminghubplay.vercel.app/index.html" onclick="showHomepage()">Gaming Hub</a></h1>
  <p>Discover and play free games anytime, anywhere!</p>
</header>
<body>

  <div class="container">
    <h1>Search Results</h1>

    <div class="search">
      <input type="text" id="search-input" placeholder="Search for games..." onkeyup="searchGamesAutomatically()" />
      <button onclick="submitSearch()">Search</button>
    </div>

    <div class="games-grid" id="games">
      <!-- Game items will appear here -->
      <div class="game" data-name="Taming.io" onclick="loadGame('tamingio')">
        <img src="https://via.placeholder.com/100x75" alt="Taming.io">
        <h3>Taming.io</h3>
      </div>
      <div class="game" data-name="Minecraft" onclick="loadGame('minecraft')">
        <img src="https://via.placeholder.com/100x75" alt="Minecraft">
        <h3>Minecraft</h3>
      </div>
      <div class="game" data-name="Fortnite" onclick="loadGame('fortnite')">
        <img src="https://via.placeholder.com/100x75" alt="Fortnite">
        <h3>Fortnite</h3>
      </div>
      <div class="game" data-name="League of Legends" onclick="loadGame('leagueoflegends')">
        <img src="https://via.placeholder.com/100x75" alt="League of Legends">
        <h3>League of Legends</h3>
      </div>
      <!-- Add more games here as needed -->
    </div>
  </div>

  <script>
    // List of games with their URLs and corresponding game names
  // List of games with their URLs and corresponding game names
  const games = [
    { name: "Taming.io", url: "https://www.taming.io" },
    { name: "Minecraft", url: "https://www.minecraft.net" },
    { name: "Fortnite", url: "https://www.epicgames.com/fortnite" },
    { name: "League of Legends", url: "https://www.leagueoflegends.com" },
    // Add more games here...
  ];

  // Function to search games based on the search query
  function searchGamesAutomatically() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const gamesGrid = document.getElementById('games');
    const gameItems = gamesGrid.getElementsByClassName('game');

    // Loop through the game items and hide those that don't match the query
    for (let i = 0; i < gameItems.length; i++) {
      const gameName = gameItems[i].querySelector('h3').textContent.toLowerCase();
      if (gameName.includes(query)) {
        gameItems[i].style.display = 'block';
      } else {
        gameItems[i].style.display = 'none';
      }
    }
  }

  // Function to populate the search input from the URL and trigger the search
  function handleURLSearch() {
    // Extract the search term from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const searchTerm = urlParams.get("q"); // Assumes the query string is like /search?q=[search-term]

    if (searchTerm) {
      // Populate the search input field
      const searchInput = document.getElementById('search-input');
      searchInput.value = decodeURIComponent(searchTerm);

      // Trigger the automatic search
      searchGamesAutomatically();
    }
  }

  // Function to submit the search and redirect to the search results page
  function submitSearch() {
    const searchInput = document.getElementById('search-input').value.trim();
    if (searchInput) {
      // Redirect with a query string
      window.location.href = `/search?q=${encodeURIComponent(searchInput)}`;
    }
  }

  // Function to handle the game loading and URL update
  function loadGame(gameName) {
    // Change the URL to the game name
    history.pushState({}, "", `/${gameName}`);

    // Simulate navigation to the new URL
    window.location.href = `/${gameName}`;
  }

  // Automatically handle search when the page loads
  window.onload = handleURLSearch;
</script>



</body>
</html>

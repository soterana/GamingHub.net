  document.addEventListener("DOMContentLoaded", async () => {
    // Mapping of languages to their respective subdomains

      // Find the language for the country
      const language = countryToLanguage[countryCode] || "en"; // Default to "en" if no match found

      // Find the corresponding subdomain for the language

        const baseDomain = "gaminghubplay.vercel.app";

        // Ensure we're not already on the correct subdomain

          window.location.href = `https://${subdomain}-gaminghubplay.netlify.app`;

     async function loadEnglishGames() {
  const securityCode = '2822/gaminghubplay.vercel.app';  // The security code you want to use

  try {
    // URL of the English database
    const databaseUrl = 'https://soterdatabase.vercel.app/en-database.html';

    // Fetch the database with security code in the headers
    const response = await fetch(databaseUrl, {
      headers: {
        'X-Security-Code': securityCode  // Adding security code header for validation
      }
    });

    if (!response.ok) throw new Error('Failed to fetch database');

    // Parse and extract games
    const databaseHtml = await response.text();
    const parser = new DOMParser();
    const databaseDoc = parser.parseFromString(databaseHtml, 'text/html');
    const games = databaseDoc.querySelector('.games-database').innerHTML;

    // Replace the content of the #games div
    document.getElementById('games').innerHTML = games;
  } catch (error) {
    document.getElementById('games').innerHTML = '<p>Error loading games. Please try again later.</p>';
    console.error('Error loading database:', error);
  }
}
